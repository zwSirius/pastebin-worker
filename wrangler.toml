name = "pb"
compatibility_date = "2025-04-24"

workers_dev = false
main = "worker/index.ts"

[[rules]]
type = "Text"
globs = [ "**/*.html", "**/*.md", "**/*.css" ]
fallthrough = true

[assets]
directory = "dist/frontend"
run_worker_first = true
binding = "ASSETS"

[triggers]
# clean r2 garbage every day; skipped automatically in KV-only mode
crons = ["0 0 * * *"]

[observability]
# enable to collect logs
enabled = true

#----------------------------------------
# lines below are what you should modify
#----------------------------------------

[[routes]]
# Refer to https://developers.cloudflare.com/workers/wrangler/configuration/#routes
pattern = "doc.740319.xyz"
custom_domain = true

[[kv_namespaces]]
binding = "PB"  # do not touch this
id = "79dd6b5e686445cb8b7f3de1bc783830"  # id of your KV namespace

[[r2_buckets]]
binding = "R2"  # do not touch this
bucket_name = ""  # empty: KV-only mode; set a real bucket name to enable R2 storage

[vars]
# must be consistent with your routes
DEPLOY_URL = "https://doc.740319.xyz"

# url to repo, displayed in the index page
REPO = "https://github.com/SharzyL/pastebin-worker"

# the page title displayed in index page
INDEX_PAGE_TITLE = "Pastebin Worker"

# the name displayed in TOS
TOS_MAINTAINER = "miffy"

# the email displayed in TOS
TOS_MAIL = "admin@doc.740319.xyz"

# Cache-Control max-age for static pages
CACHE_STATIC_PAGE_AGE = 7200

# Cache-Control max-age for paste pages
CACHE_PASTE_AGE = 600

# Default expiration
DEFAULT_EXPIRATION = "7d"

# Max expiration
MAX_EXPIRATION = "90d"

# A collection of {username: password} pair
# Leave empty to disable auth
# value must be a bcrypt hash, generate with: node scripts/bcrypt.js
# Set it in wrangler.secret.toml (gitignored) instead of committing a real hash here.
BASIC_AUTH = {}

# Files larger than this threshold will be stored in R2
# (ignored in KV-only mode, i.e. when bucket_name above is empty)
R2_THRESHOLD = "20K"

# File larger than this will be denied
R2_MAX_ALLOWED = "256M"

# The following mimetypes will be converted to text/plain
# text/html is intentionally NOT listed so HTML pastes render in the browser
DISALLOWED_MIME_FOR_PASTE = ["audio/x-mpegurl"]
